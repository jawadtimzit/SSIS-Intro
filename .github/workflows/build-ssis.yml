name: Build SSIS Project

on:
  push:
    branches: [ main, feature/** ]

jobs:
  build-ssis:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build SSIS project
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\devenv.com" "SSIS Intro.sln" /Build Release
